<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vault</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --field: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2481cc);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { padding: 28px 20px; max-width: 480px; margin: 0 auto; }
  .lock { font-size: 28px; }
  h1 { font-size: 20px; font-weight: 600; margin: 10px 0 4px; }
  p { color: var(--hint); margin: 0 0 24px; font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 0 0 6px 2px; }
  .row { position: relative; margin-bottom: 18px; }
  input { width: 100%; border: 0; outline: none; border-radius: 12px; padding: 14px 48px 14px 14px;
    background: var(--field); color: var(--text); font: inherit; font-family: ui-monospace, Menlo, monospace; }
  input:focus { box-shadow: 0 0 0 2px var(--accent); }
  #name { text-transform: uppercase; padding-right: 14px; }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none;
    color: var(--hint); font-size: 18px; padding: 8px; cursor: pointer; }
  .fallback { display: none; width: 100%; border: 0; border-radius: 12px; padding: 14px; margin-top: 6px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="lock">🔐</div>
  <h1 id="title">Add a key</h1>
  <p>Goes straight to your bots' vault. It never shows in the chat.</p>
  <div class="row" id="nameRow">
    <label for="name">Name</label>
    <input id="name" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="EVOLINK_API_KEY">
  </div>
  <div class="row">
    <label for="value">Key</label>
    <input id="value" type="password" autocomplete="off" spellcheck="false" placeholder="Paste here">
    <button class="eye" id="eye" type="button" aria-label="Show">👁</button>
  </div>
  <button class="fallback" id="save" type="button">Save to vault</button>
</main>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const q = new URLSearchParams(location.search);
  const nameEl = document.getElementById('name');
  const valueEl = document.getElementById('value');
  const clean = s => (s || '').toUpperCase().replace(/[^A-Z0-9_]/g, '_').replace(/^_+/, '');
  const preset = clean(q.get('name'));
  if (preset) {
    nameEl.value = preset;
    document.getElementById('nameRow').style.display = 'none';
    document.getElementById('title').textContent = q.get('label') || preset;
  }
  document.getElementById('eye').onclick = () => {
    valueEl.type = valueEl.type === 'password' ? 'text' : 'password';
  };
  const ready = () => /^[A-Z][A-Z0-9_]{1,63}$/.test(clean(nameEl.value)) && valueEl.value.trim().length > 0;
  function save() {
    if (!ready()) { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error'); return; }
    const data = JSON.stringify({ t: 'vault', name: clean(nameEl.value), value: valueEl.value.trim() });
    valueEl.value = '';
    if (tg && tg.sendData) tg.sendData(data);
  }
  if (tg && tg.initData !== undefined) {
    tg.ready(); tg.expand();
    tg.MainButton.setText('Save to vault');
    const sync = () => ready() ? tg.MainButton.show() : tg.MainButton.hide();
    nameEl.oninput = valueEl.oninput = sync;
    tg.MainButton.onClick(save);
    sync();
  } else {
    document.getElementById('save').style.display = 'block';
    document.getElementById('save').onclick = save;
  }
  (preset ? valueEl : nameEl).focus();
</script>
</body>
</html>
