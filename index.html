<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vault</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --field: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2481cc);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { padding: 28px 20px; max-width: 480px; margin: 0 auto; }
  .lock { font-size: 28px; }
  h1 { font-size: 20px; font-weight: 600; margin: 10px 0 4px; }
  p { color: var(--hint); margin: 0 0 24px; font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 0 0 6px 2px; }
  .row { position: relative; margin-bottom: 18px; }
  input { width: 100%; border: 0; outline: none; border-radius: 12px; padding: 14px 48px 14px 14px;
    background: var(--field); color: var(--text); font: inherit; font-family: ui-monospace, Menlo, monospace; }
  input:focus { box-shadow: 0 0 0 2px var(--accent); }
  #name { text-transform: uppercase; padding-right: 14px; }
  .eye { position: absolute; right: 8px; bottom: 7px; border: 0; background: none; color: var(--hint);
    padding: 6px; cursor: pointer; display: flex; opacity: .7; }
  .eye.on { color: var(--accent); opacity: 1; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #cc, #exp, #cvv, #holder { padding-right: 14px; }
  .fallback { display: none; width: 100%; border: 0; border-radius: 12px; padding: 14px; margin-top: 6px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="lock" id="icon">🔐</div>
  <h1 id="title">Add a key</h1>
  <p id="sub">Goes straight to your bots' vault. It never shows in the chat.</p>
  <div class="row" id="nameRow">
    <label for="name">Name</label>
    <input id="name" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="EVOLINK_API_KEY">
  </div>
  <div id="keyForm">
  <div class="row">
    <label for="value" id="valueLabel">Key</label>
    <input id="value" type="password" autocomplete="off" spellcheck="false" placeholder="Paste here">
    <button class="eye" id="eye" type="button" aria-label="Show"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  </div>
  <div id="cardForm" style="display:none">
    <div class="row"><label for="cc">Card number</label>
      <input id="cc" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" maxlength="23"></div>
    <div class="two">
      <div class="row"><label for="exp">Expiry</label>
        <input id="exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5"></div>
      <div class="row"><label for="cvv">CVV</label>
        <input id="cvv" type="password" inputmode="numeric" autocomplete="cc-csc" placeholder="•••" maxlength="4"></div>
    </div>
    <div class="row"><label for="holder">Name on card</label>
      <input id="holder" autocomplete="cc-name" autocapitalize="characters" placeholder="WILLIAM BAKER"></div>
  </div>
  <button class="fallback" id="save" type="button">Save to vault</button>
</main>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const q = new URLSearchParams(location.search);
  const nameEl = document.getElementById('name');
  const valueEl = document.getElementById('value');
  const clean = s => (s || '').toUpperCase().replace(/[^A-Z0-9_]/g, '_').replace(/^_+/, '');
  const preset = clean(q.get('name'));
  if (preset) {
    nameEl.value = preset;
    document.getElementById('nameRow').style.display = 'none';
    document.getElementById('title').textContent = q.get('label') || preset;
  }
  document.getElementById('eye').onclick = e => {
    valueEl.type = valueEl.type === 'password' ? 'text' : 'password';
    e.currentTarget.classList.toggle('on', valueEl.type === 'text');
  };
  const isCard = q.get('type') === 'card';
  const cc = document.getElementById('cc'), exp = document.getElementById('exp'),
        cvv = document.getElementById('cvv'), holder = document.getElementById('holder');
  if (isCard) {
    document.getElementById('keyForm').style.display = 'none';
    document.getElementById('cardForm').style.display = 'block';
    if (!q.get('label')) document.getElementById('title').textContent = 'Add a card';
    document.getElementById('icon').textContent = '💳';
    document.getElementById('sub').textContent = 'Saved to your bots\' vault. Never shown in the chat, only typed into the checkout.';
  } else if (q.get('field')) {
    document.getElementById('valueLabel').textContent = q.get('field');
  }
  const digits = s => s.replace(/\D/g, '');
  cc.addEventListener('input', () => { cc.value = digits(cc.value).slice(0, 19).replace(/(\d{4})(?=\d)/g, '$1 '); });
  exp.addEventListener('input', () => { const d = digits(exp.value).slice(0, 4); exp.value = d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; });
  cvv.addEventListener('input', () => { cvv.value = digits(cvv.value).slice(0, 4); });
  const luhn = n => { let s = 0, alt = false; for (let i = n.length - 1; i >= 0; i--) { let d = +n[i]; if (alt) { d *= 2; if (d > 9) d -= 9; } s += d; alt = !alt; } return s % 10 === 0; };
  const cardOk = () => { const n = digits(cc.value); return n.length >= 13 && luhn(n) && /^(0[1-9]|1[0-2])\/\d{2}$/.test(exp.value) && /^\d{3,4}$/.test(cvv.value) && holder.value.trim().length > 1; };
  const ready = () => /^[A-Z][A-Z0-9_]{1,63}$/.test(clean(nameEl.value)) && (isCard ? cardOk() : valueEl.value.trim().length > 0);
  function save() {
    if (!ready()) { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error'); return; }
    const name = clean(nameEl.value);
    const data = isCard
      ? JSON.stringify({ t: 'vault_card', prefix: name, number: digits(cc.value), expiry: exp.value, cvv: cvv.value, holder: holder.value.trim().toUpperCase() })
      : JSON.stringify({ t: 'vault', name, value: valueEl.value.trim() });
    valueEl.value = ''; cc.value = ''; cvv.value = '';
    if (tg && tg.sendData) tg.sendData(data);
  }
  if (tg && tg.initData !== undefined) {
    tg.ready(); tg.expand();
    tg.MainButton.setText('Save to vault');
    const sync = () => ready() ? tg.MainButton.show() : tg.MainButton.hide();
    [nameEl, valueEl, cc, exp, cvv, holder].forEach(el => el.addEventListener('input', sync));
    tg.MainButton.onClick(save);
    sync();
  } else {
    document.getElementById('save').style.display = 'block';
    document.getElementById('save').onclick = save;
  }
  (isCard ? cc : preset ? valueEl : nameEl).focus();
</script>
</body>
</html>
